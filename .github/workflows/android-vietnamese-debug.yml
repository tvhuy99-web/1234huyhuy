name: Vietnamese Android debug APK

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'audiodefence/**'
      - 'game/**'
      - 'localization/**'
      - 'VERSION'
      - '.github/signing/**'
      - '.github/workflows/android-vietnamese-debug.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'audiodefence/**'
      - 'game/**'
      - 'localization/**'
      - 'VERSION'
      - '.github/signing/**'
      - '.github/workflows/android-vietnamese-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vietnamese-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out sources and original game assets
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check the Android SDK already provided by the Ubuntu runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Vietnamese translation
        run: |
          python tools/check_vietnamese.py --strict
          python tools/verify_localization.py --language "Tiếng Việt"

      - name: Verify bundled stable signing certificate BEFORE build
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          source = Path(".github/signing/stable-debug.keystore.b64")
          dest = Path("android/.gradle/stable-debug.p12")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_bytes(base64.b64decode(source.read_text().strip(), validate=True))
          assert dest.stat().st_size > 1000
          PY
          EXPECTED=fe1606ae0459e6823e549a4f50404b59e263198dda30b33ecc1a7f3d4be9ed5d
          ACTUAL="$(keytool -list -v -storetype PKCS12 \
            -keystore android/.gradle/stable-debug.p12 -storepass android \
            -alias audiodefence-stable-debug | grep -m1 'SHA256:' \
            | sed 's/.*SHA256: *//' | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          test "$ACTUAL" = "$EXPECTED" || { echo "Unexpected keystore fingerprint: $ACTUAL"; exit 1; }
          echo "Stable debug key fingerprint verified: $ACTUAL"

      - name: Build debug APK (signed with stable public test key)
        run: gradle -p android --no-daemon :app:assembleDebug -PbuildPython="$(command -v python)" --stacktrace

      - name: Verify Vietnamese assets are inside APK
        run: |
          python - <<'PY'
          import glob, json, zipfile
          apks = glob.glob('android/app/build/outputs/apk/debug/*.apk')
          assert len(apks) == 1, f'Expected exactly one debug APK, got {apks}'
          with zipfile.ZipFile(apks[0]) as apk:
              # Android's APK ZIP writer may store UTF-8 filename bytes without the ZIP
              # Unicode flag. Python then decodes them as CP437, unlike Android/Java.
              # Normalize names for verification only; the APK itself is unchanged.
              def unicode_name(filename):
                  try:
                      return filename.encode('cp437').decode('utf-8')
                  except (UnicodeError, ValueError):
                      return filename
              names = {unicode_name(name): name for name in apk.namelist()}
              print('Localization entries:', [n for n in names if n.startswith('assets/localization/')])
              assert 'assets/localization/Tiếng Việt.json' in names, 'Vietnamese JSON is absent from APK'
              assert 'assets/data-manifest.txt' in names, 'Game data manifest is absent from APK'
              assert any(p.startswith('assets/game/') for p in names), 'Original game sound/data assets are absent'
              language = json.loads(apk.read(names['assets/localization/Tiếng Việt.json']))
              assert language['@plural'] == 'none'
              assert language['Play'] == 'Chơi'
              assert len([k for k in language if not k.startswith('@')]) >= 1495
              print('VERIFIED:', apks[0], 'Vietnamese phrases:', len(language)-1,
                    'assets:', len(names))
          PY

      - name: Verify stable signing certificate on built APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          EXPECTED=fe1606ae0459e6823e549a4f50404b59e263198dda30b33ecc1a7f3d4be9ed5d
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/audiodefence-apksigner.txt
          ACTUAL="$(grep -m1 'certificate SHA-256 digest:' /tmp/audiodefence-apksigner.txt \
            | sed 's/.*digest: *//' | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          test "$ACTUAL" = "$EXPECTED" || { echo "Wrong APK signing fingerprint: $ACTUAL"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 "^package: name='com.audiodefence.android'"
          echo "APK signed with permanent testing certificate: $ACTUAL"

      - name: Upload installable test APK (not a production release)
        uses: actions/upload-artifact@v4
        with:
          name: AudioDefence-Vietnamese-Android-DEBUG
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
